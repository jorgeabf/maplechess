# Actualizaciones de las dependencias y de las acciones de la CI, una vez por
# semana. Cada una llega como PR y pasa por la CI y la revisión, como todo.
#
# La espera (cooldown) deja pasar unos días desde que sale una versión: si un
# paquete se publica comprometido, suele retirarse antes. No se aplica a las
# actualizaciones de seguridad, que llegan en cuanto salen.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # Las menores y los parches, en un solo PR; cada versión mayor, en el suyo.
      menores:
        update-types: [minor, patch]
    ignore:
      # Los tipos de Node van con la versión que se usa (24, en la CI y en el
      # README): los de una mayor nueva dejarían pasar funciones que Node 24 no
      # tiene. Se quita al cambiar de versión de Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # playwright-core va con el Chromium que ya está descargado (chromium-1223),
      # en la carpeta de navegadores que comparten otros proyectos. Otra versión
      # pide otro Chromium: se sube a mano (ver scripts/medir.mjs).
      - dependency-name: playwright-core

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      acciones:
        patterns: ['*']
