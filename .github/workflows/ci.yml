# Comprobaciones de cada PR y de main: lint, tipos y tests. No despliega: el
# despliegue y las operaciones de producción se hacen a mano (ver CLAUDE.md).
# El nombre del job ("CI") es la comprobación obligatoria de la protección de main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Las acciones, fijadas por SHA (la etiqueta, en el comentario): una etiqueta
      # se puede mover. Dependabot las actualiza (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Sin versión: usa la de packageManager en package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # worker-configuration.d.ts no se versiona; wrangler lo genera sin credenciales.
      - run: pnpm exec wrangler types
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
